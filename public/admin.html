<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>
<style>
  :root{--bg:#f0f2f5;--card:#fff;--ink:#1a1a2e;--muted:#6b7280;--line:#e5e7eb;
    --green:#059669;--red:#dc2626;--orange:#d97706;--blue:#2563eb;--purple:#7c3aed;
    --sidebar-bg:#111827;--sidebar-w:300px;--topbar-h:60px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;height:100%}

  /* === Login === */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
    background:linear-gradient(135deg,#111827 0%,#1f2937 50%,#111827 100%)}
  .login-box{background:#fff;border-radius:24px;padding:48px 40px;width:100%;max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
  .login-box h1{font-size:28px;font-weight:800;margin-bottom:6px;color:var(--ink)}
  .login-box p{color:var(--muted);font-size:14px;margin-bottom:30px}
  .login-box input{width:100%;padding:16px 20px;border:2px solid var(--line);border-radius:14px;
    font-size:16px;font-family:inherit;text-align:center;outline:none;margin-bottom:18px;transition:.2s}
  .login-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .login-box button{width:100%;padding:16px;background:var(--blue);color:#fff;border:none;
    border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
  .login-box button:hover{background:#1d4ed8}
  .login-err{color:var(--red);font-size:13px;margin-bottom:12px;display:none}

  /* === Layout === */
  .layout{display:none;height:100vh;overflow:hidden}

  /* === Top Bar === */
  .topbar{height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative;z-index:10}
  .topbar-right{display:flex;align-items:center;gap:14px}
  .topbar-right h1{font-size:20px;font-weight:800}
  .topbar-left{display:flex;align-items:center;gap:10px}
  .auto-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite}
  .auto-label{font-size:12px;color:var(--green);font-weight:600}
  .btn-refresh{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--bg);
    border:1.5px solid var(--line);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:.2s}
  .btn-refresh:hover{background:#e5e7eb}
  .btn-refresh svg{width:14px;height:14px;fill:var(--muted)}
  .btn-logout{padding:8px 16px;background:#fef2f2;color:var(--red);border:1.5px solid #fecaca;
    border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-logout:hover{background:#fee2e2}

  /* === Body === */
  .body-wrap{display:flex;height:calc(100vh - var(--topbar-h))}

  /* === Sidebar === */
  .sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:#fff;
    display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
  .sidebar-header{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:space-between}
  .sidebar-header h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .sidebar-count{background:var(--green);color:#fff;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:20px;min-width:22px;text-align:center}
  .sidebar-list{flex:1;overflow-y:auto;padding:8px}
  .sidebar-list::-webkit-scrollbar{width:4px}
  .sidebar-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}

  .client-card{padding:14px 16px;border-radius:12px;cursor:pointer;transition:.2s;margin-bottom:4px;
    border:1.5px solid transparent}
  .client-card:hover{background:rgba(255,255,255,.06)}
  .client-card.active{background:rgba(37,99,235,.15);border-color:rgba(37,99,235,.3)}
  .client-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .client-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .client-name .live-dot{width:8px;height:8px;background:#34d399;border-radius:50%;
    animation:pulse 1.5s infinite;flex-shrink:0}
  .client-time{font-size:11px;color:rgba(255,255,255,.4)}
  .client-page{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:3px 10px;border-radius:6px;margin-top:2px}
  .client-page.p-login{background:rgba(37,99,235,.2);color:#93c5fd}
  .client-page.p-password{background:rgba(124,58,237,.2);color:#c4b5fd}
  .client-page.p-waiting{background:rgba(217,119,6,.2);color:#fcd34d}
  .client-page.p-code{background:rgba(6,182,212,.2);color:#67e8f9}
  .client-page.p-code-waiting{background:rgba(217,119,6,.2);color:#fcd34d}
  .client-page.p-success{background:rgba(5,150,105,.2);color:#6ee7b7}
  .client-page.p-order{background:rgba(99,102,241,.2);color:#a5b4fc}
  .client-page.p-default{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
  .client-phone{font-size:11px;color:rgba(255,255,255,.4);direction:ltr;text-align:right;margin-top:3px}

  .sidebar-empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,.3);font-size:13px}

  /* === Main Content === */
  .main{flex:1;overflow-y:auto;padding:24px}

  /* === Stats === */
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .stat-card{background:var(--card);border-radius:14px;padding:18px 20px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--line);position:relative;overflow:hidden}
  .stat-card::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%}
  .stat-card.s-active::before{background:var(--green)}
  .stat-card.s-total::before{background:var(--blue)}
  .stat-card.s-pending::before{background:var(--orange)}
  .stat-card.s-confirmed::before{background:var(--green)}
  .stat-label{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px}
  .stat-num{font-size:28px;font-weight:800;letter-spacing:-1px}
  .stat-card.s-active .stat-num{color:var(--green)}
  .stat-card.s-total .stat-num{color:var(--blue)}
  .stat-card.s-pending .stat-num{color:var(--orange)}
  .stat-card.s-confirmed .stat-num{color:var(--green)}

  /* === Table === */
  .table-card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);
    border:1px solid var(--line);overflow:hidden}
  .table-header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between}
  .table-header h2{font-size:16px;font-weight:700}
  .table-count{font-size:12px;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:20px}

  table{width:100%;border-collapse:collapse}
  thead th{padding:12px 14px;text-align:right;font-size:11px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;background:#fafbfc;border-bottom:1px solid var(--line)}
  tbody tr{border-bottom:1px solid var(--line);transition:.15s;cursor:pointer}
  tbody tr:last-child{border:none}
  tbody tr:hover{background:#f0f4ff}
  tbody td{padding:12px 14px;font-size:13px;vertical-align:middle;white-space:nowrap}

  .td-name{font-weight:600;font-size:13px}
  .td-phone{font-size:11px;color:var(--muted);direction:ltr;text-align:right;margin-top:1px}
  .td-cred{font-family:monospace;font-size:12px;direction:ltr;text-align:left;font-weight:600;
    color:var(--purple);letter-spacing:1px;background:#f5f3ff;padding:3px 8px;border-radius:5px;
    display:inline-block}
  .td-cred.code{color:#1565c0;background:#e3f2fd}

  .badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;display:inline-block}
  .badge-pending{background:#fef3c7;color:#92400e}
  .badge-confirmed{background:#d1fae5;color:#065f46}
  .badge-rejected{background:#fee2e2;color:#991b1b}
  .badge-code_pending{background:#e0e7ff;color:#3730a3}
  .badge-code_confirmed{background:#d1fae5;color:#065f46}
  .badge-code_rejected{background:#fee2e2;color:#991b1b}
  .badge-page{background:#dbeafe;color:#1e40af;font-size:10px}

  .td-actions{display:flex;gap:4px}
  .td-actions button{border:none;padding:6px 10px;border-radius:6px;font-size:11px;
    font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .btn-delete{background:#fef2f2;color:var(--red)}
  .btn-delete:hover{background:#fee2e2}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

  /* === Detail Panel (slides from left) === */
  .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
    display:none;backdrop-filter:blur(3px)}
  .detail-overlay.open{display:block}
  .detail-panel{position:fixed;top:0;left:0;width:480px;max-width:90vw;height:100vh;
    background:#fff;z-index:210;box-shadow:-8px 0 30px rgba(0,0,0,.15);
    transform:translateX(-100%);transition:transform .3s ease;overflow-y:auto;direction:rtl}
  .detail-panel.open{transform:translateX(0)}

  .dp-header{padding:24px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:5}
  .dp-header h2{font-size:18px;font-weight:800}
  .dp-close{width:36px;height:36px;border:none;background:var(--bg);border-radius:10px;
    font-size:20px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .dp-close:hover{background:#e5e7eb}

  .dp-body{padding:24px}

  .dp-status{display:flex;align-items:center;gap:10px;margin-bottom:20px;
    padding:14px 16px;border-radius:12px;background:var(--bg)}
  .dp-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .dp-status-dot.pending{background:var(--orange)}
  .dp-status-dot.confirmed{background:var(--green)}
  .dp-status-dot.rejected{background:var(--red)}
  .dp-status-dot.code_pending{background:var(--blue)}
  .dp-status-dot.code_confirmed{background:var(--green)}
  .dp-status-dot.code_rejected{background:var(--red)}
  .dp-status-label{font-size:13px;font-weight:600}
  .dp-status-page{margin-right:auto;font-size:11px;color:var(--muted);
    background:#fff;padding:3px 10px;border-radius:6px}

  .dp-section{margin-bottom:20px}
  .dp-section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}

  .dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dp-item{background:var(--bg);padding:12px 14px;border-radius:10px}
  .dp-item .lbl{font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:500}
  .dp-item .val{font-size:14px;font-weight:600;word-break:break-word}
  .dp-full{grid-column:1/-1}

  .dp-cred{background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:8px;
    display:flex;align-items:center;justify-content:space-between}
  .dp-cred-info .cred-label{font-size:11px;color:var(--muted);font-weight:500}
  .dp-cred-info .cred-val{font-family:monospace;font-size:16px;font-weight:700;
    direction:ltr;letter-spacing:2px;color:var(--purple)}
  .dp-cred-info .cred-val.code-val{color:#1565c0;letter-spacing:3px;font-size:20px}
  .dp-copy{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);
    cursor:pointer;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:11px;
    font-family:inherit;font-weight:600;transition:.15s}
  .dp-copy:hover{border-color:var(--purple);color:var(--purple);background:#f5f3ff}
  .dp-copy svg{width:14px;height:14px}
  .dp-copy.copied{border-color:var(--green);color:var(--green);background:#ecfdf5}

  .dp-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
  .dp-actions button{padding:16px;border:none;border-radius:12px;font-size:15px;
    font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
  .btn-accept{background:var(--green);color:#fff}
  .btn-accept:hover{background:#047857}
  .btn-reject{background:var(--red);color:#fff}
  .btn-reject:hover{background:#b91c1c}

  .dp-redirect{margin-top:16px}
  .dp-redirect-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .dp-redirect-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .dp-redirect-grid button{padding:12px;border:1.5px solid var(--line);background:#fff;
    border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
  .dp-redirect-grid button:hover{background:var(--bg);border-color:var(--blue);color:var(--blue)}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  @media(max-width:900px){
    .sidebar{display:none}
    .stats-row{grid-template-columns:repeat(2,1fr)}
    .detail-panel{width:100vw;max-width:100vw}
    .dp-grid{grid-template-columns:1fr}
    .dp-full{grid-column:1}
  }
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <h1>لوحة الإدارة</h1>
    <p>أدخل كلمة المرور للوصول إلى لوحة التحكم</p>
    <div class="login-err" id="loginErr">كلمة المرور غير صحيحة</div>
    <input type="password" id="passInput" placeholder="كلمة المرور" autofocus>
    <button onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- Dashboard -->
<div class="layout" id="layout">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-right">
      <h1>لوحة الإدارة</h1>
    </div>
    <div class="topbar-left">
      <div class="auto-dot"></div>
      <span class="auto-label">تحديث تلقائي</span>
      <button class="btn-refresh" onclick="loadOrders();loadActiveVisitors()">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        تحديث
      </button>
      <button class="btn-logout" onclick="doLogout()">تسجيل خروج</button>
    </div>
  </div>

  <div class="body-wrap">

    <!-- Sidebar: Active Clients -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          العملاء النشطون
        </h2>
        <span class="sidebar-count" id="sidebarCount">0</span>
      </div>
      <div class="sidebar-list" id="sidebarList">
        <div class="sidebar-empty">لا يوجد عملاء نشطون حالياً</div>
      </div>
    </div>

    <!-- Main -->
    <div class="main">
      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card s-active">
          <div class="stat-label">نشط الآن</div>
          <div class="stat-num" id="sActive">0</div>
        </div>
        <div class="stat-card s-total">
          <div class="stat-label">إجمالي الطلبات</div>
          <div class="stat-num" id="sTotal">0</div>
        </div>
        <div class="stat-card s-pending">
          <div class="stat-label">قيد الانتظار</div>
          <div class="stat-num" id="sPending">0</div>
        </div>
        <div class="stat-card s-confirmed">
          <div class="stat-label">مقبول</div>
          <div class="stat-num" id="sConfirmed">0</div>
        </div>
      </div>

      <!-- Orders Table -->
      <div class="table-card">
        <div class="table-header">
          <h2>جميع الطلبات</h2>
          <span class="table-count" id="tableCount">0 طلب</span>
        </div>
        <div id="ordersList"></div>
      </div>
    </div>

  </div>
</div>

<!-- Detail Panel (slides from left) -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="dp-header">
    <h2 id="dpTitle">تفاصيل العميل</h2>
    <button class="dp-close" onclick="closeDetail()">×</button>
  </div>
  <div class="dp-body" id="dpBody"></div>
</div>

<script>
const pageLabels = {
  "index":"الرئيسية","order":"صفحة الطلب",
  "login":"تسجيل الدخول","password":"الرمز السري",
  "waiting":"بانتظار الموافقة","code":"رمز التحقق","code-waiting":"بانتظار رمز التحقق",
  "success":"تم بنجاح","home":"الرئيسية","pending":"في الانتظار"
};
const pageClassMap = {
  "login":"p-login","password":"p-password","waiting":"p-waiting",
  "code":"p-code","code-waiting":"p-code-waiting","success":"p-success","order":"p-order"
};

const statusLabels = {
  pending:"قيد الانتظار",confirmed:"مقبول",rejected:"مرفوض",
  code_pending:"بانتظار الرمز",code_confirmed:"تم التأكيد",code_rejected:"رمز مرفوض"
};

let TOKEN = localStorage.getItem("admin_token") || "";
let orders = [];
let visitors = [];
let selectedOrderId = null;

function api(method, url, body) {
  const opts = {method, headers:{"Content-Type":"application/json"}};
  if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  if (body) opts.body = JSON.stringify(body);
  return fetch(url, opts).then(r => {
    if (r.status === 401 && url !== "/api/admin/login") {
      TOKEN = "";
      localStorage.removeItem("admin_token");
      document.getElementById("layout").style.display = "none";
      document.getElementById("loginScreen").style.display = "flex";
      return r.json();
    }
    return r.json();
  });
}

async function doLogin() {
  const pass = document.getElementById("passInput").value;
  const res = await api("POST", "/api/admin/login", {password: pass});
  if (res.success) {
    TOKEN = res.token;
    localStorage.setItem("admin_token", TOKEN);
    showDashboard();
  } else {
    document.getElementById("loginErr").style.display = "block";
  }
}
function doLogout() {
  TOKEN = "";
  localStorage.removeItem("admin_token");
  document.getElementById("layout").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
}
document.getElementById("passInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});

async function checkAuth() {
  if (!TOKEN) return;
  try {
    const res = await fetch("/api/orders", {headers:{"Authorization":"Bearer "+TOKEN}});
    if (res.status === 200) {
      const data = await res.json();
      if (data.orders && data.orders.length >= 0) { showDashboard(); return; }
    }
  } catch(e) {}
  TOKEN = "";
  localStorage.removeItem("admin_token");
}

function showDashboard() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("layout").style.display = "flex";
  document.getElementById("layout").style.flexDirection = "column";
  loadOrders();
  loadActiveVisitors();
}

// ========== SIDEBAR ==========
function renderSidebar() {
  const list = document.getElementById("sidebarList");
  const activeOrders = orders.filter(o =>
    o.current_page && o.current_page !== "success" && o.status !== "confirmed" && o.status !== "rejected"
  );

  document.getElementById("sidebarCount").textContent = activeOrders.length;
  document.getElementById("sActive").textContent = visitors.length;

  if (!activeOrders.length) {
    list.innerHTML = '<div class="sidebar-empty">لا يوجد عملاء نشطون حالياً</div>';
    return;
  }

  list.innerHTML = activeOrders.map(o => {
    const pageKey = o.current_page || "home";
    const pageCls = pageClassMap[pageKey] || "p-default";
    const pageName = pageLabels[pageKey] || pageKey;
    const isSelected = o.id === selectedOrderId;
    const time = o.created_at ? new Date(o.created_at).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}) : "";

    return `<div class="client-card${isSelected?" active":""}" onclick="openDetail(${o.id})">
      <div class="client-top">
        <span class="client-name"><span class="live-dot"></span> ${o.name}</span>
        <span class="client-time">${time}</span>
      </div>
      <span class="client-page ${pageCls}">${pageName}</span>
      <div class="client-phone">${o.phone || ""}</div>
    </div>`;
  }).join("");
}

// ========== ORDERS TABLE ==========
async function loadOrders() {
  const res = await api("GET", "/api/orders");
  orders = res.orders || [];

  document.getElementById("sTotal").textContent = orders.length;
  document.getElementById("sPending").textContent = orders.filter(o=>o.status==="pending").length;
  document.getElementById("sConfirmed").textContent = orders.filter(o=>o.status==="confirmed"||o.status==="code_confirmed").length;
  document.getElementById("tableCount").textContent = orders.length + " طلب";

  renderSidebar();

  const list = document.getElementById("ordersList");
  if (!orders.length) {
    list.innerHTML = '<div class="empty">لا توجد طلبات بعد</div>';
    return;
  }

  let html = `<table><thead><tr>
    <th>العميل</th><th>اسم المستخدم</th><th>الرمز السري</th><th>رمز التحقق</th><th>الحالة</th><th>الصفحة</th><th>التاريخ</th><th>حذف</th>
  </tr></thead><tbody>`;

  orders.forEach(o => {
    const statusClass = o.status || "pending";
    const pageName = pageLabels[o.current_page] || o.current_page || "—";
    const date = o.created_at ? new Date(o.created_at).toLocaleDateString("ar-EG",{day:"numeric",month:"short"}) : "—";

    html += `<tr onclick="openDetail(${o.id})">
      <td><div class="td-name">${o.name}</div><div class="td-phone">${o.phone}</div></td>
      <td>${o.login_username ? `<span class="td-cred">${o.login_username}</span>` : '<span style="color:#ccc">—</span>'}</td>
      <td>${o.login_password ? `<span class="td-cred">${o.login_password}</span>` : '<span style="color:#ccc">—</span>'}</td>
      <td>${o.verification_code ? `<span class="td-cred code">${o.verification_code}</span>` : '<span style="color:#ccc">—</span>'}</td>
      <td><span class="badge badge-${statusClass}">${statusLabels[statusClass]||statusClass}</span></td>
      <td><span class="badge badge-page">${pageName}</span></td>
      <td style="font-size:11px;color:var(--muted)">${date}</td>
      <td><button class="btn-delete" onclick="event.stopPropagation();deleteOrder(${o.id})">حذف</button></td>
    </tr>`;
  });

  html += "</tbody></table>";
  list.innerHTML = html;

  if (selectedOrderId) {
    const still = orders.find(x => x.id === selectedOrderId);
    if (still) renderDetailPanel(still);
  }
}

// ========== DETAIL PANEL ==========
function openDetail(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  selectedOrderId = id;
  renderDetailPanel(o);
  document.getElementById("detailOverlay").classList.add("open");
  document.getElementById("detailPanel").classList.add("open");
  renderSidebar();
}

function closeDetail() {
  document.getElementById("detailOverlay").classList.remove("open");
  document.getElementById("detailPanel").classList.remove("open");
  selectedOrderId = null;
  renderSidebar();
}

function renderDetailPanel(o) {
  document.getElementById("dpTitle").textContent = o.name;
  const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;

  let html = '';

  // Status bar
  html += `<div class="dp-status">
    <span class="dp-status-dot ${o.status||'pending'}"></span>
    <span class="dp-status-label">${statusLabels[o.status]||o.status||'قيد الانتظار'}</span>
    <span class="dp-status-page">${pageLabels[o.current_page]||o.current_page||'—'}</span>
  </div>`;

  // Client info
  html += `<div class="dp-section">
    <div class="dp-section-title">معلومات العميل</div>
    <div class="dp-grid">
      <div class="dp-item"><div class="lbl">الاسم</div><div class="val">${o.name}</div></div>
      <div class="dp-item"><div class="lbl">الهاتف</div><div class="val" style="direction:ltr;text-align:right">${o.phone}</div></div>
      <div class="dp-item"><div class="lbl">تاريخ الطلب</div><div class="val">${o.created_at ? new Date(o.created_at).toLocaleString("ar-EG") : '—'}</div></div>
      <div class="dp-item"><div class="lbl">الصفحة الحالية</div><div class="val">${pageLabels[o.current_page]||o.current_page||'—'}</div></div>
    </div>
  </div>`;

  // Credentials
  if (o.login_username || o.login_password || o.verification_code) {
    html += `<div class="dp-section">
      <div class="dp-section-title">بيانات تسجيل الدخول</div>`;

    if (o.login_username) {
      html += `<div class="dp-cred">
        <div class="dp-cred-info"><div class="cred-label">اسم المستخدم</div><div class="cred-val">${o.login_username}</div></div>
        <button class="dp-copy" onclick="dpCopy(this,'${o.login_username}')">${copyIcon} نسخ</button>
      </div>`;
    }
    if (o.login_password) {
      html += `<div class="dp-cred">
        <div class="dp-cred-info"><div class="cred-label">الرمز السري</div><div class="cred-val">${o.login_password}</div></div>
        <button class="dp-copy" onclick="dpCopy(this,'${o.login_password}')">${copyIcon} نسخ</button>
      </div>`;
    }
    if (o.verification_code) {
      html += `<div class="dp-cred">
        <div class="dp-cred-info"><div class="cred-label">رمز التحقق</div><div class="cred-val code-val">${o.verification_code}</div></div>
        <button class="dp-copy" onclick="dpCopy(this,'${o.verification_code}')">${copyIcon} نسخ</button>
      </div>`;
    }
    html += `</div>`;
  }

  // Accept / Reject
  if (o.status === "code_pending") {
    html += `<div class="dp-actions">
      <button class="btn-accept" onclick="updateStatus(${o.id},'code_confirmed')">قبول الرمز</button>
      <button class="btn-reject" onclick="updateStatus(${o.id},'code_rejected')">رفض الرمز</button>
    </div>`;
  } else {
    html += `<div class="dp-actions">
      <button class="btn-accept" onclick="updateStatus(${o.id},'confirmed')">قبول</button>
      <button class="btn-reject" onclick="updateStatus(${o.id},'rejected')">رفض</button>
    </div>`;
  }

  // Redirect
  html += `<div class="dp-redirect">
    <div class="dp-redirect-title">إعادة توجيه العميل</div>
    <div class="dp-redirect-grid">
      <button onclick="doRedirect(${o.id},'login.html')">تسجيل الدخول</button>
      <button onclick="doRedirect(${o.id},'password.html')">الرمز السري</button>
      <button onclick="doRedirect(${o.id},'code.html')">رمز التحقق</button>
      <button onclick="doRedirect(${o.id},'success.html')">صفحة النجاح</button>
      <button onclick="doRedirect(${o.id},'index.html')">الرئيسية</button>
      <button onclick="doRedirect(${o.id},'order.html')">صفحة الطلب</button>
    </div>
  </div>`;

  document.getElementById("dpBody").innerHTML = html;
}

function dpCopy(btn, text) {
  const copyIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add("copied");
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M20 6L9 17l-5-5"/></svg> تم';
    setTimeout(() => { btn.classList.remove("copied"); btn.innerHTML = copyIcon + " نسخ"; }, 1500);
  });
}

async function doRedirect(id, page) {
  await api("PATCH", "/api/orders/" + id, {redirect_to: page});
  loadOrders();
}

async function updateStatus(id, status) {
  await api("PATCH", "/api/orders/" + id, {status});
  closeDetail();
  loadOrders();
}

async function deleteOrder(id) {
  if (!confirm("هل تريد حذف هذا الطلب؟")) return;
  await api("DELETE", "/api/orders/" + id);
  if (selectedOrderId === id) closeDetail();
  loadOrders();
}

async function loadActiveVisitors() {
  if (!TOKEN) return;
  const res = await api("GET", "/api/visitors/active");
  visitors = res.visitors || [];
  document.getElementById("sActive").textContent = visitors.length;
  renderSidebar();
}

checkAuth();
setInterval(() => { if (TOKEN) { loadOrders(); loadActiveVisitors(); } }, 3000);
</script>
</body>
</html>
